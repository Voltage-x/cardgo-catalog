id: taishin-richart
name: 台新 Richart
issuer: 台新銀行
image: catalog/cards/taishin-richart.png
networks: [visa, mastercard]
source: https://www.taishinbank.com.tw/TSB/personal/credit/intro/overview/future/ab46dfa7-5d88-11f1-b50f-0050568c09e3
effective:
  from: "2026-07-01"
  to: "2027-12-31"
settlement:
  note: 指定方案以當天最後一次切換回溯整天。沒切到的消費走一般消費，保費固定 1.3%。
  retroactive: calendar_day
caveat: 費率是有設定台新帳戶扣繳後的數字；沒扣繳時切換刷最高 1.3%。全家和 7-ELEVEN 只算台新 Pay。指定店走外送或電商只算 3.3%。保費固定 1.3%。假日刷要另外勾「今天是國定假日」。加碼消費以永久額度加 30 萬為上限，這裡沒有計。1 點台新 Point 先按 1 元。
flags:
  - {id: holiday, name: 今天是國定假日}

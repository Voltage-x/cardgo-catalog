  - {id: daily, name: 天天刷}
  - {id: chill, name: Chill刷}
  - {id: pay, name: Pay著刷}
  - {id: big, name: 大筆刷}
  - {id: dining, name: 好饗刷}
  - {id: digital, name: 數趣刷}
  - {id: travel, name: 玩旅刷}
  - {id: holiday, name: 假日刷}
switches:
  - {id: daily, max: 1, period: calendar_day, actions: [change_scheme]}

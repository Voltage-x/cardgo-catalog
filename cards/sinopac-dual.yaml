id: sinopac-dual
name: 永豐幣倍
issuer: 永豐銀行
networks: [visa, mastercard, jcb]
reward: twd_cash
source: https://bank.sinopac.com/sinopacBT/personal/credit-card/introduction/bankcard/dual-currency-card.html
effective:
  from: "2026-07-01"
  to: "2026-12-31"
settlement:
  note: 精選通路加碼上限依結帳日的帳單週期，三種幣別合併計算。兩項任務要自己勾。
caveat: 國內 1%、國外 2% 無上限，保費另計 1.2%。國外回饋入外幣帳戶，這裡按等值台幣。精選通路加碼 4% 要同時完成永豐臺外幣自動扣繳加電子帳單，以及前月資產月均 10 萬或當月大戶。網購算不算國外，看帳單有沒有國外交易，這裡用你標的國內外。國外實體加碼把實體刷卡當成面對面。分期不計。
flags:
  - {id: linked, name: 永豐臺外幣自動扣繳＋電子帳單}
  - {id: qualified, name: 前月資產 10 萬或當月大戶}

rules:
  - id: domestic
    kind: general
    label: 國內一般消費
    when: {regions: [domestic]}
    unless: {any_merchant: [insurance]}
    rate: 0.01
  - id: overseas
    kind: general
    label: 國外一般消費
    when: {regions: [overseas]}
    unless: {any_merchant: [insurance]}
    rate: 0.02
  - id: insurance
    label: 保費
    when: {any_merchant: [insurance]}
    rate: 0.012
  - id: selected
    label: 精選通路
    when: {flags_all: [linked, qualified], any_merchant: ["group:selected"]}
    mode: extra
    rate: 0.04
    cap: {id: dual_selected, max_reward: 800, period: billing_cycle}
  - id: selected_present
    label: 國外實體
    when:
      flags_all: [linked, qualified]
      regions: [overseas]
      rails: [card_present]
    unless: {any_merchant: ["group:selected", insurance]}
    mode: extra
    rate: 0.04
    cap: {id: dual_selected, max_reward: 800, period: billing_cycle}

rules:
  - id: dining
    label: 樂饗購
    when: {schemes: [dining], any_merchant: ["group:dining"]}
    rate_by_tier: &level {l1: 0.02, l2: 0.03, l3: 0.033}
  - id: digital
    label: 玩數位
    when: {schemes: [digital], any_merchant: ["group:digital"]}
    rate_by_tier: *level
  - id: travel
    label: 趣旅行
    when: {schemes: [travel], any_merchant: ["group:travel"]}
    rate_by_tier: *level
  - id: travel_overseas
    label: 趣旅行海外
    when: {schemes: [travel], regions: [overseas]}
    rate_by_tier: *level
  - id: select
    label: 集精選
    when: {schemes: [select], any_merchant: ["group:select"]}
    rate: 0.02
  - id: fpg
    label: 台塑家
    when: {schemes: [fpg], any_merchant: ["group:fpg"]}
    rate: 0.02
  - id: fixed_overseas
    label: 固定回饋海外
    when: {schemes: [fixed], regions: [overseas]}
    rate: 0.025
  - id: fixed_general
    kind: general
    label: 固定回饋
    when: {schemes: [fixed]}
    unless: {any_merchant: [insurance]}
    rate: 0.012
  - id: pxpay
    label: 全支付
    when: {schemes: [pxpay], regions: [domestic], rails: [pxpay], any_merchant: [pxpay]}
    rate: 0.02
  - id: autumn_8
    label: 秋日遊
    effective: &autumn {from: "2026-10-01", to: "2026-11-30"}
    when: {schemes: [autumn], any_merchant: ["group:autumn_8"]}
    rate: 0.08
  - id: autumn_5
    label: 秋日遊
    effective: *autumn
    when: {schemes: [autumn], any_merchant: ["group:autumn_5"]}
    rate: 0.05
  - id: autumn_uniqlo_jp
    label: 秋日遊
    effective: *autumn
    when: {schemes: [autumn], regions: [overseas], any_merchant: [uniqlo]}
    rate: 0.05
  - id: autumn_4
    label: 秋日遊
    effective: *autumn
    when: {schemes: [autumn], any_merchant: ["group:autumn_4"]}
    rate: 0.04
  - id: autumn_35
    label: 秋日遊
    effective: *autumn
    when: {schemes: [autumn], any_merchant: ["group:autumn_35"]}
    rate: 0.035
  - id: autumn_3
    label: 秋日遊
    effective: *autumn
    when: {schemes: [autumn], any_merchant: ["group:autumn_3"]}
    rate: 0.03
  - id: general
    kind: general
    label: 一般消費
    unless: {any_merchant: [utilities, insurance, tax]}
    rate: 0.003

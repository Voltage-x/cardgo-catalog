rules:
  - id: dining
    label: 樂饗購
    when: {schemes: [dining], any_merchant: ["group:dining"]}
    mode: instead
    rate_by_tier: {l1: 0.02, l2: 0.03, l3: 0.033}
    reward: cathay_tree_point
  - id: digital
    label: 玩數位
    when: {schemes: [digital], any_merchant: ["group:digital"]}
    mode: instead
    rate_by_tier: {l1: 0.02, l2: 0.03, l3: 0.033}
    reward: cathay_tree_point
  - id: travel
    label: 趣旅行
    when: {schemes: [travel], any_merchant: ["group:travel"]}
    mode: instead
    rate_by_tier: {l1: 0.02, l2: 0.03, l3: 0.033}
    reward: cathay_tree_point
  - id: travel_overseas
    label: 趣旅行海外
    when: {schemes: [travel], regions: [overseas]}
    mode: instead
    rate_by_tier: {l1: 0.02, l2: 0.03, l3: 0.033}
    reward: cathay_tree_point
  - id: select
    label: 集精選
    when: {schemes: [select], any_merchant: ["group:select"]}
    mode: instead
    rate: 0.02
    reward: cathay_tree_point
  - id: fpg
    label: 台塑家
    when: {schemes: [fpg], any_merchant: ["group:fpg"]}
    mode: instead
    rate: 0.02
    reward: cathay_tree_point
  - id: fixed_overseas
    label: 固定回饋海外
    when: {schemes: [fixed], regions: [overseas]}
    mode: instead
    rate: 0.025
    reward: cathay_tree_point
  - id: fixed_general
    kind: general
    label: 固定回饋
    when: {schemes: [fixed]}
    unless: {any_merchant: [insurance]}
    mode: instead
    rate: 0.012
    reward: cathay_tree_point
  - id: general
    kind: general
    label: 一般消費
    unless: {any_merchant: [utilities, insurance, tax]}
    mode: instead
    rate: 0.003
    reward: cathay_tree_point

  to: "2026-12-31"
settlement:
  note: 指定方案以當天最後一次切換回溯整天。沒切到的消費走一般消費。
  retroactive: calendar_day
caveat: 費率依 2026 公開方案。LEVEL 2/3 的達成條件在銀行端，這裡只記你現在的等級。秋日遊的領券加碼、Klook 指定日本商品 5% 沒有計。日本實體 3.5% 要選「日本」，不含其他國家。全支付只算選了全支付的國內消費。

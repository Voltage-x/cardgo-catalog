id: ctbc-linepay
name: 中國信託 LINE Pay 卡
issuer: 中國信託
image: catalog/cards/ctbc-linepay.png
networks: [visa, mastercard, jcb]
source: https://www.ctbcbank.com/content/dam/minisite/long/creditcard/LINEPay/page_food.html
effective:
  from: "2026-07-01"
  to: "2026-12-31"
settlement:
  note: Visa / JCB 指定通路要先在銀行登錄才有加碼。上限是日曆季。
caveat: 1 LINE POINT 先按 1 元。Shopback 這類導購加碼沒有寫進規則。
tiers:
  - {id: standard, name: 一般}
flags:
  - {id: "enrolled:visa_h2", name: 已登錄 Visa 指定通路}
  - {id: "enrolled:jcb_h2", name: 已登錄 JCB 指定通路}
groups:
  visa_promo: [uber_eats, starbucks, shopee, taobao, netflix, ikea]
  jcb_promo: [sushiro, kura_sushi, mos_burger, komeda, lopia, uniqlo, gu, donki, nitori]
  excluded: [seven_eleven, family_mart, hi_life, ok_mart, pxmart, utilities, telecom, tax, insurance]
rules:
  - id: overseas
    label: 海外實體
    when: {regions: [overseas], rails: [card_present]}
    mode: instead
    rate: 0.028
    reward: line_points
  - id: visa_promo
    label: Visa 指定通路
    when:
      networks: [visa]
      regions: [domestic]
      flags_all: ["enrolled:visa_h2"]
      any_merchant: ["group:visa_promo"]
    mode: instead
    rate: 0.05
    reward: line_points
    cap: {id: linepay_visa_q, max_reward: 100, period: calendar_quarter}
  - id: jcb_promo
    label: JCB 指定通路
    when:
      networks: [jcb]
      regions: [domestic]
      flags_all: ["enrolled:jcb_h2"]
      any_merchant: ["group:jcb_promo"]
    mode: instead
    rate: 0.10
    reward: line_points
    cap: {id: linepay_jcb_q, max_reward: 200, period: calendar_quarter}
  - id: general
    kind: general
    label: 一般消費
    unless: {any_merchant: ["group:excluded"]}
    mode: instead
    rate: 0.01
    reward: line_points

id: esun-unicard
name: 玉山 Unicard
issuer: 玉山銀行
image: catalog/cards/esun-unicard.png
networks: [visa, mastercard, jcb]
source: https://www.esunbank.com/zh-tw/personal/credit-card/intro/bank-card/unicard
effective:
  from: "2026-07-01"
  to: "2026-12-31"
settlement:
  note: 百大加碼以每月最後一天的方案結算。這裡用你現在選的方案估算。
caveat: 用 LINE Pay 等支付去買電商或百貨時，銀行可能改算成行動支付。1 點 e point 先按 1 元。
tiers:
  - {id: standard, name: 一般}
flags:
  - {id: ebill, name: 電子帳單}
  - {id: autodebit, name: 玉山台幣帳戶自動扣繳}
schemes:
  - {id: simple, name: 簡單選}
  - {id: pick8, name: 任意選, pick_max: 8, pick_pool: unicard_top100}
  - {id: up, name: UP選}
switches:
  - {id: monthly, max: 30, period: calendar_month, actions: [change_scheme, change_picks]}
